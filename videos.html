    <script>
        (function () {
            var list = document.getElementById('filmList');

            function createFilm(item, index) {
                var article = document.createElement('article');
                article.className = 'film-entry';
                if (item.orientation === 'landscape') article.classList.add('is-landscape');

                var stage = document.createElement('div');
                stage.className = 'film-stage';
                if (item.orientation === 'landscape') stage.classList.add('is-landscape');

                var video = document.createElement('video');
                video.controls = true;
                video.playsInline = true;
                video.preload = 'metadata';
                video.poster = item.poster || '';
                video.src = item.src;
                video.setAttribute('aria-label', item.title || 'Short film');
                stage.appendChild(video);

                var hasCopy = !!(item.title || item.caption || item.duration);
                if (hasCopy) {
                    var copy = document.createElement('div');
                    copy.className = 'film-copy';

                    var number = document.createElement('p');
                    number.className = 'film-number';
                    number.textContent = String(index + 1).padStart(2, '0');
                    copy.appendChild(number);

                    if (item.title) {
                        var name = document.createElement('h2');
                        name.className = 'film-name';
                        name.textContent = item.title;
                        copy.appendChild(name);
                    }
                    if (item.caption) {
                        var caption = document.createElement('p');
                        caption.className = 'film-caption';
                        caption.textContent = item.caption;
                        copy.appendChild(caption);
                    }
                    if (item.duration) {
                        var duration = document.createElement('p');
                        duration.className = 'film-duration';
                        duration.textContent = item.duration;
                        copy.appendChild(duration);
                    }
                    article.appendChild(stage);
                    article.appendChild(copy);
                } else {
                    article.classList.add('is-video-only');
                    article.appendChild(stage);
                }
                return article;
            }

            fetch('videos/manifest.json?cb=' + Date.now())
                .then(function (response) {
                    if (!response.ok) throw new Error('Films are temporarily unavailable.');
                    return response.json();
                })
                .then(function (data) {
                    var videos = (data && data.videos) || [];
                    list.textContent = '';
                    if (!videos.length) {
                        list.innerHTML = '<p class="film-status">No films yet.</p>';
                        return;
                    }
                    videos.slice().reverse().forEach(function (item, index) {
                        list.appendChild(createFilm(item, index));
                    });
                    list.querySelectorAll('video').forEach(function (player) {
                        player.addEventListener('play', function () {
                            list.querySelectorAll('video').forEach(function (other) {
                                if (other !== player) other.pause();
                            });
                        });
                    });
                })
                .catch(function (error) {
                    list.innerHTML = '<p class="film-status">' + error.message + '</p>';
                });
        })();
    </script>
