<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Photos - Manoj's Blog</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="sidebar.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">Manoj's Blog</a>
                                    <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="photos.html">Photos</a></li>
                <li><a href="iss-tracker/">ISS Tracker</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-content">
            <h1>Photos</h1>
            <p class="page-sub">Moments, snapshots, places I&#39;ve been.</p>

            <div id="photoGrid" class="photo-feed" aria-live="polite"></div>
            <p id="photoEmpty" class="photo-empty" style="display:none;">No photos yet — check back soon.</p>
            <p id="photoError" class="photo-error" style="display:none;"></p>
        </div>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightboxImg" alt="">
    </div>

    <footer>
        <div class="footer-social">
            <a href="mailto:ponugotimanojkumar@gmail.com" class="social-link" aria-label="Email Manoj">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                <span>ponugotimanojkumar@gmail.com</span>
            </a>
        </div>
    </footer>

    <script>
        (function () {
            var grid = document.getElementById('photoGrid');
            var emptyMsg = document.getElementById('photoEmpty');
            var errMsg = document.getElementById('photoError');
            var lb = document.getElementById('lightbox');
            var lbImg = document.getElementById('lightboxImg');
            var lbClose = lb.querySelector('.lightbox-close');

            function makePhotoButton(p, className) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = className;
                btn.setAttribute('aria-label', 'Open photo' + (p.caption ? ': ' + p.caption : ''));
                var img = document.createElement('img');
                img.src = p.src;
                img.alt = p.caption || '';
                img.loading = 'lazy';
                btn.appendChild(img);
                btn.addEventListener('click', function () {
                    openLightbox(p.src, p.caption);
                });
                return btn;
            }

            function renderPhotoSet(photos) {
                photos.sort(function (a, b) {
                    return (a.setOrder || 0) - (b.setOrder || 0);
                });

                var slideCount = photos.length;
                var carousel = document.createElement('section');
                carousel.className = 'photo-carousel';
                carousel.setAttribute('aria-label', 'Photo slideshow');

                var stage = document.createElement('div');
                stage.className = 'photo-carousel-stage';
                stage.tabIndex = 0;
                var track = document.createElement('div');
                track.className = 'photo-carousel-track';

                var suppressClick = false;

                photos.forEach(function (p, index) {
                    var slide = document.createElement('div');
                    slide.className = 'photo-carousel-slide';
                    slide.setAttribute('aria-label', 'Photo ' + (index + 1) + ' of ' + slideCount);
                    var btn = makePhotoButton(p, 'photo-carousel-image');
                    btn.addEventListener('click', function (e) {
                        if (suppressClick) {
                            e.preventDefault();
                            e.stopImmediatePropagation();
                        }
                    }, true);
                    slide.appendChild(btn);
                    track.appendChild(slide);
                });

                var previous = document.createElement('button');
                previous.type = 'button';
                previous.className = 'photo-carousel-arrow photo-carousel-previous';
                previous.setAttribute('aria-label', 'Previous photo');
                previous.innerHTML = '&#8249;';

                var next = document.createElement('button');
                next.type = 'button';
                next.className = 'photo-carousel-arrow photo-carousel-next';
                next.setAttribute('aria-label', 'Next photo');
                next.innerHTML = '&#8250;';

                var count = document.createElement('span');
                count.className = 'photo-carousel-count';
                count.textContent = '1 / ' + slideCount;

                var dots = document.createElement('div');
                dots.className = 'photo-carousel-dots';
                photos.forEach(function (_, dotIndex) {
                    var dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'photo-carousel-dot' + (dotIndex === 0 ? ' is-active' : '');
                    dot.setAttribute('aria-label', 'Go to photo ' + (dotIndex + 1));
                    dots.appendChild(dot);
                });

                var index = 0;
                var pointerId = null;
                var startX = 0;
                var startY = 0;
                var startOffset = 0;
                var dragDelta = 0;
                var dragAxis = null;
                var samples = [];
                var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                var SNAP_MS = reduceMotion ? 140 : 420;
                var FLICK_VELOCITY = 0.42;
                var DRAG_CLICK_THRESHOLD = 8;

                function stageWidth() {
                    return stage.clientWidth || 1;
                }

                function baseOffset() {
                    return -index * stageWidth();
                }

                function rubberBandOffset(rawOffset) {
                    var min = -(slideCount - 1) * stageWidth();
                    var max = 0;
                    if (rawOffset > max) return max + (rawOffset - max) * 0.3;
                    if (rawOffset < min) return min + (rawOffset - min) * 0.3;
                    return rawOffset;
                }

                function applyTransform(px, animate) {
                    track.classList.toggle('is-dragging', !animate && pointerId !== null);
                    track.classList.toggle('is-animating', !!animate);
                    track.style.transitionDuration = animate ? SNAP_MS + 'ms' : '0ms';
                    track.style.transform = 'translate3d(' + px + 'px, 0, 0)';
                }

                function updateUI() {
                    count.textContent = (index + 1) + ' / ' + slideCount;
                    Array.prototype.forEach.call(dots.children, function (dot, dotIndex) {
                        dot.classList.toggle('is-active', dotIndex === index);
                    });
                    previous.disabled = index === 0;
                    next.disabled = index === slideCount - 1;
                    stage.setAttribute('data-index', String(index));
                }

                function goTo(targetIndex, animate) {
                    index = Math.max(0, Math.min(slideCount - 1, targetIndex));
                    applyTransform(baseOffset(), animate !== false);
                    updateUI();
                }

                function nearestIndex(offset) {
                    return Math.max(0, Math.min(slideCount - 1, Math.round(-offset / stageWidth())));
                }

                function finishDrag() {
                    var velocity = 0;
                    if (samples.length >= 2) {
                        var first = samples[0];
                        var last = samples[samples.length - 1];
                        var dt = last.t - first.t;
                        if (dt > 0) velocity = (last.x - first.x) / dt;
                    }

                    var rawOffset = startOffset + dragDelta;
                    var target = index;
                    if (Math.abs(velocity) > FLICK_VELOCITY) {
                        target = velocity < 0 ? index + 1 : index - 1;
                    } else {
                        target = nearestIndex(rawOffset);
                    }

                    dragDelta = 0;
                    samples = [];
                    goTo(target, true);
                }

                function resetDragState() {
                    pointerId = null;
                    dragAxis = null;
                    track.classList.remove('is-dragging');
                }

                function onPointerDown(e) {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    if (e.target.closest('.photo-carousel-arrow, .photo-carousel-dot')) return;

                    pointerId = e.pointerId;
                    suppressClick = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    startOffset = baseOffset();
                    dragDelta = 0;
                    dragAxis = null;
                    samples = [{ x: e.clientX, t: performance.now() }];
                    track.classList.add('is-dragging');
                    track.style.transitionDuration = '0ms';
                    stage.setPointerCapture(e.pointerId);
                }

                function onPointerMove(e) {
                    if (e.pointerId !== pointerId) return;

                    var dx = e.clientX - startX;
                    var dy = e.clientY - startY;
                    if (!dragAxis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
                        dragAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
                        if (dragAxis === 'y') {
                            resetDragState();
                            try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
                            return;
                        }
                    }
                    if (dragAxis !== 'x') return;

                    e.preventDefault();
                    dragDelta = dx;
                    if (Math.abs(dragDelta) > DRAG_CLICK_THRESHOLD) suppressClick = true;

                    samples.push({ x: e.clientX, t: performance.now() });
                    if (samples.length > 8) samples.shift();

                    applyTransform(rubberBandOffset(startOffset + dragDelta), false);
                }

                function onPointerUp(e) {
                    if (e.pointerId !== pointerId) return;
                    var wasDragging = dragAxis === 'x';
                    resetDragState();
                    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
                    if (wasDragging) finishDrag();
                    if (suppressClick) {
                        setTimeout(function () { suppressClick = false; }, 0);
                    }
                }

                stage.addEventListener('pointerdown', onPointerDown);
                stage.addEventListener('pointermove', onPointerMove, { passive: false });
                stage.addEventListener('pointerup', onPointerUp);
                stage.addEventListener('pointercancel', onPointerUp);

                previous.addEventListener('click', function () { goTo(index - 1, true); });
                next.addEventListener('click', function () { goTo(index + 1, true); });
                Array.prototype.forEach.call(dots.children, function (dot, dotIndex) {
                    dot.addEventListener('click', function () { goTo(dotIndex, true); });
                });

                stage.addEventListener('keydown', function (e) {
                    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1, true); }
                    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1, true); }
                });

                var resizeTimer;
                window.addEventListener('resize', function () {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        applyTransform(baseOffset(), false);
                    }, 100);
                });

                stage.appendChild(track);
                carousel.appendChild(stage);
                carousel.appendChild(previous);
                carousel.appendChild(next);
                carousel.appendChild(count);
                carousel.appendChild(dots);
                grid.appendChild(carousel);
                goTo(0, false);
            }

            function renderSinglePhotos(photos) {
                if (!photos.length) return;
                var legacyGrid = document.createElement('div');
                legacyGrid.className = 'photo-grid';
                photos.forEach(function (p) {
                    legacyGrid.appendChild(makePhotoButton(p, 'photo-tile'));
                });
                grid.appendChild(legacyGrid);
            }

            function openLightbox(src, alt) {
                lbImg.src = src;
                lbImg.alt = alt || '';
                lb.classList.add('is-open');
                lb.setAttribute('aria-hidden', 'false');
            }
            function closeLightbox() {
                lb.classList.remove('is-open');
                lb.setAttribute('aria-hidden', 'true');
                lbImg.src = '';
            }
            lb.addEventListener('click', function (e) {
                if (e.target === lb || e.target === lbClose) closeLightbox();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLightbox();
            });

            // Cache-bust manifest so new uploads show up immediately
            fetch('gallery/manifest.json?cb=' + Date.now())
                .then(function (r) {
                    if (!r.ok) throw new Error('Failed to load gallery (' + r.status + ').');
                    return r.json();
                })
                .then(function (data) {
                    var photos = (data && data.photos) || [];
                    if (!photos.length) {
                        emptyMsg.style.display = '';
                        return;
                    }
                    var reversed = photos.slice().reverse();
                    var sets = {};
                    var singles = [];
                    reversed.forEach(function (p) {
                        if (p.set) {
                            if (!sets[p.set]) sets[p.set] = [];
                            sets[p.set].push(p);
                        } else {
                            singles.push(p);
                        }
                    });
                    Object.keys(sets).forEach(function (setName) {
                        renderPhotoSet(sets[setName]);
                    });
                    renderSinglePhotos(singles);
                })
                .catch(function (err) {
                    console.error(err);
                    emptyMsg.style.display = '';
                });
        })();
    </script>
</body>
</html>
